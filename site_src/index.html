<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>演员库 · actor-em</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark"></span>
    <h1>演员库</h1>
    <span id="count" class="count">加载中…</span>
  </div>
  <nav class="tabs" id="tabs" role="tablist">
    <button type="button" data-view="actors" class="on" role="tab">演员</button>
    <button type="button" data-view="dict" role="tab">字典</button>
    <button type="button" data-view="mdcx" role="tab">MDCx</button>
  </nav>
  <div class="search">
    <input id="q" type="search" placeholder="搜名字 / 别名 / 标签，如 三上、桥本有菜、E罩杯" autocomplete="off" spellcheck="false">
  </div>
  <button id="theme" class="icon-btn" title="切换深浅色" aria-label="切换深浅色">◐</button>
</header>

<section id="view-actors">
<div class="toolbar">
  <select id="source" aria-label="数据源">
    <option value="">全部演员</option>
    <option value="jp">日系</option>
    <option value="eu">欧美（StashDB）</option>
  </select>
  <select id="cup" aria-label="罩杯">
    <option value="">全部罩杯</option>
  </select>
  <select id="height" aria-label="身高">
    <option value="">全部身高</option>
    <option value="-150">150cm 以下</option>
    <option value="150-155">150–155cm</option>
    <option value="155-160">155–160cm</option>
    <option value="160-165">160–165cm</option>
    <option value="165-170">165–170cm</option>
    <option value="170-">170cm 以上</option>
  </select>
  <select id="region" aria-label="出生地">
    <option value="">全部出生地</option>
    <option value="jp">日本</option>
    <option value="other">其他</option>
  </select>
  <select id="country" aria-label="具体国家" hidden></select>
  <select id="sort" aria-label="排序">
    <option value="name">按名字</option>
    <option value="birth">按出生年（新→旧）</option>
    <option value="height">按身高（高→低）</option>
    <option value="cup">按罩杯（大→小）</option>
    <option value="debut">按出道年（新→旧）</option>
    <option value="popularity">按人气（JavStash/StashDB）</option>
  </select>
  <label class="chk"><input type="checkbox" id="onlyAvatar"> 只看有图</label>
  <div id="tagbar" class="tagbar"></div>
</div>

<main>
  <div id="grid" class="grid"></div>
  <div id="sentinel" class="sentinel"></div>
  <p id="empty" class="empty" hidden>没有匹配的演员，换个关键词试试。</p>
</main>
</section>

<section id="view-dict" hidden>
  <div class="toolbar">
    <select id="dict-src" aria-label="来源">
      <option value="">全部来源</option>
      <option value="mdcx">mdcx</option>
      <option value="amane">amane</option>
    </select>
    <span class="hint">抓取清单的合并结果：一个别名一行归并成一个人，点名字可跳到演员详情。</span>
  </div>
  <div class="tablewrap">
    <table class="dtable">
      <thead>
        <tr><th>日文名</th><th>中文名</th><th>来源</th><th>别名</th></tr>
      </thead>
      <tbody id="dict-body"></tbody>
    </table>
  </div>
  <div id="dict-sentinel" class="sentinel"></div>
  <p id="dict-empty" class="empty" hidden>没有匹配的条目。</p>
</section>

<section id="view-mdcx" hidden>
  <div class="toolbar">
    <select id="mdcx-sort" aria-label="排序">
      <option value="name">按日文名</option>
      <option value="career">按出道年（新→旧）</option>
      <option value="height">按身高（高→低）</option>
    </select>
    <span class="hint">MDCx 原始档案（我们字段的地基），点一行展开简介，点名字跳到演员详情。</span>
  </div>
  <div class="tablewrap">
    <table class="dtable wide">
      <thead>
        <tr>
          <th>日文名</th><th>中文名</th><th>生日</th><th>出生地</th><th>身高</th>
          <th>罩杯</th><th>三围</th><th>出道</th><th>标签</th>
        </tr>
      </thead>
      <tbody id="mdcx-body"></tbody>
    </table>
  </div>
  <div id="mdcx-sentinel" class="sentinel"></div>
  <p id="mdcx-empty" class="empty" hidden>没有匹配的档案。</p>
</section>

<footer class="foot">
  数据来自 actor-em 每日同步 · <span id="generated"></span>
</footer>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="m-name">
    <button id="m-close" class="icon-btn close" aria-label="关闭">✕</button>
    <div class="m-head">
      <div class="m-thumb"><img id="m-img" alt=""><span id="m-initial" class="initial"></span></div>
      <div class="m-title">
        <h2 id="m-name"></h2>
        <p id="m-orig" class="sub"></p>
        <div id="m-facts" class="facts"></div>
      </div>
    </div>
    <div id="m-tags" class="chips"></div>
    <div class="m-section">
      <h3>别名</h3>
      <p id="m-aliases" class="muted"></p>
    </div>
    <div class="m-section">
      <h3>简介 <span id="m-bio-lang" class="bio-lang"></span></h3>
      <p id="m-bio" class="bio"></p>
    </div>
    <div class="m-section">
      <h3>头像 <button type="button" id="m-pick-avatar" class="linkish">换头像 ↗</button></h3>
      <div id="m-avatar-grid" class="avatar-grid"></div>
      <p id="m-avatar-note" class="muted"></p>
    </div>
    <div id="m-links" class="m-links"></div>
    <div id="m-xref" class="m-xref"></div>
  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/tables.js"></script>
</body>
</html>
