name: actor-sync

# 工作流 2：演员数据库同步
# 清单 = 工作流 1 产出的 actor_dict.csv 里的全部演员（actors.txt 只作手工追加）。
# 默认只处理还没入库的人；手动可选全量重抓（refresh_all）或缺字段补抓（fill_missing）。
# 产出根目录的 actors.jsonl（真源）+ actors.json（派生）。
# 前置：先跑过 base-db，仓库里要有 actor_dict.csv。

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "本轮最多处理多少个演员（0 = 不限，首铺建议 0）"
        default: "150"
      concurrency:
        description: "并发抓取数（首次全量建议 10）"
        default: "6"
      dry_run:
        description: "只打印结果，不写文件"
        type: boolean
        default: false
      refresh:
        description: "重抓指定演员，逗号分隔；名字不在字典里也行（会当新人抓，留空则只抓还没入库的）"
        default: ""
      refresh_all:
        description: "全量重抓库里所有演员（要真全量请同时把 limit 设为 0）"
        type: boolean
        default: false
      fill_missing:
        description: "只重抓有缺字段的已有演员，只填空位、不覆盖已有值"
        type: boolean
        default: false
      fill_fields:
        description: "缺字段补抓要补哪些字段，逗号分隔；留空=全部可补字段（bio,birthday,height,measurements,tags 等）"
        default: ""
      fill_order:
        description: "补字段挑人顺序：complete=最完整优先（产出最高，默认）/ missing=缺得最多优先 / name=按名字"
        default: "complete"
      fill_min_age:
        description: "补过的记退避 N 天，N 天内不再重抓，让队列往后走（0=不跳过；建议 21~30）"
        default: "0"
      backfill:
        description: "只做离线补值：用 MDCx 档案补空生日/三围/标签/身高/罩杯/出道年，并把存量出生地补成「日本·东京都」，不联网、不抓取"
        type: boolean
        default: false

permissions:
  contents: write

# 与 base-db、actor-add 共用一个 group，避免同时写数据文件
concurrency:
  group: actor-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check dictionary
        run: |
          if [ ! -f actor_dict.csv ]; then
            echo "::error::缺少 actor_dict.csv，请先手动跑一次 base-db 工作流"
            exit 1
          fi
          echo "字典行数：$(wc -l < actor_dict.csv)"

      # MDCx 的 actor-profile 是 33MB 的 sqlite，不入库，跑之前现下现导。
      # 导出成 CSV 后 Go 侧直接读，省得为 sqlite 引一套驱动。
      - name: Export MDCx profiles
        run: |
          # MDCx 提供出生地/罩杯/出道年/标签，是这些字段的唯一来源。
          # 导出失败就不要带病继续：抓出来的记录是残的，事后还得 refresh 重抓。
          python3 scripts/export_profiles.py -o /tmp/mdcx_profiles.csv

      - name: Build
        run: go build -o /tmp/actorsync ./cmd/actorsync

      # 只给存量记录补空字段：不联网、几秒跑完。
      # 抓取侧新增的字段（生日兜底、三围改厘米）只对新抓的人生效，已经 ok 的记录
      # 不会被 BuildPlan 重抓——两万条重抓要 12 小时，离线补只要几秒，所以留这个开关。
      - name: Backfill from MDCx
        if: ${{ github.event.inputs.backfill == 'true' }}
        env:
          MDCX_CSV: /tmp/mdcx_profiles.csv
          ACTORS_XLSX: actors.xlsx
        run: /tmp/actorsync --backfill

      - name: Sync actors
        if: ${{ github.event.inputs.backfill != 'true' }}
        env:
          ACTORS_TXT: actors.txt
          ACTORS_XLSX: actors.xlsx

          TPDB_API_KEY: ${{ secrets.TPDB_API_KEY }}
          JAVSTASH_API_KEY: ${{ secrets.JAVSTASH_API_KEY }}
          STASHDB_API_KEY: ${{ secrets.STASHDB_API_KEY }}
          WIKI_EMAIL: ${{ secrets.WIKI_EMAIL }}

          # 离线档案 + 头像库 + 简介兜底源
          # dramaface / 映人录 / 影中人 / jav-idol-db 默认开启（=0 可关），无需 Key
          MDCX_CSV: /tmp/mdcx_profiles.csv
          GFRIENDS: "1"
          THEACTORBASE: "1"

          # Worker webhook 模式下必须设 0：webhook 与 getUpdates 互斥
          ACTORS_REVIEW_MAX: "0"

          ACTORS_LIMIT: ${{ github.event.inputs.limit || '150' }}
          ACTORS_CONCURRENCY: ${{ github.event.inputs.concurrency || '6' }}
          ACTORS_VERBOSE: "1"
          # 通过环境变量传用户输入，不要直接拼进 shell（防命令注入）
          REFRESH_INPUT: ${{ github.event.inputs.refresh }}
          REFRESH_ALL_INPUT: ${{ github.event.inputs.refresh_all }}
          FILL_MISSING_INPUT: ${{ github.event.inputs.fill_missing }}
          FILL_FIELDS_INPUT: ${{ github.event.inputs.fill_fields }}
          FILL_ORDER_INPUT: ${{ github.event.inputs.fill_order }}
          FILL_MIN_AGE_INPUT: ${{ github.event.inputs.fill_min_age || '0' }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$REFRESH_INPUT" ]; then
            ARGS+=(--refresh "$REFRESH_INPUT")
          fi
          if [ "$REFRESH_ALL_INPUT" = "true" ]; then
            ARGS+=(--refresh-all)
          fi
          if [ "$FILL_MISSING_INPUT" = "true" ]; then
            ARGS+=(--fill-missing)
          fi
          if [ -n "$FILL_FIELDS_INPUT" ]; then
            ARGS+=(--fill-fields "$FILL_FIELDS_INPUT")
          fi
          if [ -n "$FILL_ORDER_INPUT" ]; then
            ARGS+=(--fill-order "$FILL_ORDER_INPUT")
          fi
          if [ -n "$FILL_MIN_AGE_INPUT" ] && [ "$FILL_MIN_AGE_INPUT" != "0" ]; then
            ARGS+=(--fill-min-age "$FILL_MIN_AGE_INPUT")
          fi
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          echo "运行参数：${ARGS[*]}"
          /tmp/actorsync "${ARGS[@]}"

      - name: Commit
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "actor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 本轮产物先收好：数据文件是整份重算出来的，跟远端没有合并的价值——合并必然冲突。
          # 所以策略是「落到最新 main → 把本轮产物盖回去 → 再提交」，而不是 git pull --rebase。
          # （2026-11-21 用 rebase 时，别人推进来的文档提交让 actors.jsonl 冲突，
          #   22 分钟的抓取结果整轮丢掉。）
          KEEP="$RUNNER_TEMP/actors-out"
          rm -rf "$KEEP"; mkdir -p "$KEEP"
          for f in actors.jsonl actors.json actors.manifest.json data; do
            [ -e "$f" ] && cp -a "$f" "$KEEP"/ || true
          done
          rows=$(wc -l < actors.jsonl 2>/dev/null || echo 0)
          MSG="chore(actors): sync $(date -u +%F) (${rows} actors)"

          # 对齐最新 main 并提交；返回 2 表示「内容没变」。
          # 注意：GitHub 的 run 是 bash -e，函数必须显式 return，调用点写在 if 里，
          # 否则函数返回非 0 会直接退出、走不到下面的判断。
          commit_on_latest() {
            git fetch --depth=1 origin main || return 1
            git reset --hard FETCH_HEAD || return 1
            for f in actors.jsonl actors.json actors.manifest.json; do
              if [ -f "$KEEP/$f" ]; then cp -a "$KEEP/$f" . || return 1; fi
            done
            if [ -d "$KEEP/data" ]; then
              mkdir -p data && cp -a "$KEEP/data/." data/ || return 1
            fi
            # 逐个判断存在再 add：这些文件不是每轮都会生成。
            # actors.xlsx 是纯展示派生物，日更的 2 万行二进制会把仓库撑爆，改走 artifact 上传。
            for f in actors.jsonl actors.json actors.manifest.json data \
                     data/avatar_review.json data/avatar_choices.json; do
              if [ -e "$f" ]; then git add -- "$f" || return 1; fi
            done
            if git diff --cached --quiet; then return 2; fi
            git commit -m "$MSG" || return 1
            return 0
          }

          for attempt in 1 2 3; do
            if commit_on_latest; then rc=0; else rc=$?; fi
            if [ "$rc" = 2 ]; then echo "本轮无变化，跳过提交"; exit 0; fi
            if [ "$rc" != 0 ]; then echo "提交失败（退出码 $rc）"; exit "$rc"; fi
            if git push; then echo "已推送（第 $attempt 次尝试）"; exit 0; fi
            echo "push 被拒：远端在提交期间又前进了，重新对齐后重试"
            sleep 5
          done
          echo "连续 3 次推送失败，放弃"; exit 1

      # xlsx 是给人看的派生物，不入库；每次跑完挂成 artifact，保留 90 天可下载。
      - name: Upload Excel
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: actors-xlsx
          path: actors.xlsx
          retention-days: 90
          if-no-files-found: ignore

      # 数据质量体检：只读、不改数据。有硬性问题时脚本退出码 1，
      # 这里用 continue-on-error 兜住，避免体检把整轮同步判失败。
      - name: 质量体检
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          if [ ! -f actors.jsonl ]; then
            echo "没有 actors.jsonl，跳过体检"
            exit 0
          fi
          python3 scripts/check_quality.py actors.jsonl \
            --json quality-report.json > quality-report.md 2> quality-report.err || true
          cat quality-report.md >> "$GITHUB_STEP_SUMMARY" || true
          if [ -s quality-report.err ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**体检发现硬性问题：**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat quality-report.err >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quality report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            quality-report.md
            quality-report.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "### 演员库" >> "$GITHUB_STEP_SUMMARY"
          for f in actors.jsonl actors.json actors.manifest.json; do
            [ -f "$f" ] && echo "- $f：$(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ -f actors.jsonl ]; then
            echo "- 演员数：$(wc -l < actors.jsonl)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Excel 表格（actors.xlsx）在哪下载" >> "$GITHUB_STEP_SUMMARY"
          echo "xlsx 是给人看的派生物，**不提交进仓库**（2 万行二进制日更会把仓库撑爆），而是挂成 Actions 的 artifact。" >> "$GITHUB_STEP_SUMMARY"
          echo "下载方法：打开本仓库 **Actions** 标签 → 点开这次 \`actor-sync\` 运行 → 拉到页面最底部 **Artifacts** 区 → 下载 \`actors-xlsx\`（解压后即 actors.xlsx，保留 90 天）。" >> "$GITHUB_STEP_SUMMARY"
          if [ -f actors.xlsx ]; then
            echo "- 本次已生成 actors.xlsx：$(du -h actors.xlsx | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 本次未生成 actors.xlsx（dry_run 或产物缺失），请检查 Upload Excel 步骤。" >> "$GITHUB_STEP_SUMMARY"
          fi
