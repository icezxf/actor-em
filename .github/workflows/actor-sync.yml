name: actor-sync

on:
  schedule:
    # 每天 04:00 UTC = 北京时间 12:00
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "本轮最多处理多少个演员（0 = 不限）"
        default: "150"
      dry_run:
        description: "只打印结果，不写文件"
        type: boolean
        default: false
      refresh:
        description: "重抓指定演员，逗号分隔（留空则只抓清单里还没入库的）"
        default: ""

permissions:
  contents: write

# 与 tg-command 共用同一个 group，避免批量同步和交互命令同时写 actors.json
concurrency:
  group: actor-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Refresh dictionary
        run: python3 scripts/gen_dict.py || echo "字典刷新失败，继续使用仓库内版本"

      - name: Build
        run: go build -o /tmp/actorsync ./cmd/actorsync

      - name: Sync actors
        env:
          # 清单唯一来源：actors.txt
          ACTORS_TXT: actors.txt
          ACTORS_XLSX: actors.xlsx

          TPDB_API_KEY: ${{ secrets.TPDB_API_KEY }}
          JAVSTASH_API_KEY: ${{ secrets.JAVSTASH_API_KEY }}
          STASHDB_API_KEY: ${{ secrets.STASHDB_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          WIKI_EMAIL: ${{ secrets.WIKI_EMAIL }}

          ALIST_URL: ${{ secrets.ALIST_URL }}
          ALIST_USER: ${{ secrets.ALIST_USER }}
          ALIST_PASS: ${{ secrets.ALIST_PASS }}
          ALIST_DIR: ${{ secrets.ALIST_DIR }}
          ALIST_PUBLIC_BASE: ${{ secrets.ALIST_PUBLIC_BASE }}

          # Worker webhook 模式下必须设 0：webhook 与 getUpdates 互斥，
          # 这里一旦调 getUpdates 就会拿到 409 Conflict，还会吃掉用户点击。
          ACTORS_REVIEW_MAX: "0"

          ACTORS_LIMIT: ${{ github.event.inputs.limit || '150' }}
          ACTORS_VERBOSE: "1"
          # 通过环境变量传用户输入，不要直接拼进 shell（防命令注入）
          REFRESH_INPUT: ${{ github.event.inputs.refresh }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$REFRESH_INPUT" ]; then
            ARGS="--refresh $REFRESH_INPUT"
          fi
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          /tmp/actorsync $ARGS

      - name: Commit
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "actor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A actors.json actors.manifest.json data/actor_dict.csv \
            data/avatar_review.json data/avatar_choices.json
          [ -f actors.xlsx ] && git add actors.xlsx || true
          if git diff --cached --quiet; then
            echo "本轮无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(actors): sync $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push
