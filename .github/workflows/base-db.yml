name: base-db

# 工作流 1：基础数据库更新
# 拉 amane + MDCx 的演员映射表，合并去重，产出仓库根目录的 actor_dict.csv。
# 两个源都没变时脚本直接退出，不产生提交。

on:
  workflow_dispatch:
    inputs:
      force:
        description: "忽略缓存，强制重新下载两个源"
        type: boolean
        default: false

permissions:
  contents: write

# 与 actor-sync 共用，避免两个工作流同时提交
concurrency:
  group: actor-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build actor_dict.csv
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          ARGS=""
          if [ "$FORCE" = "true" ]; then ARGS="--force"; fi
          python3 scripts/build_base_db.py $ARGS

      - name: Commit
        run: |
          git config user.name  "actor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actor_dict.csv data/base_sources.json
          if git diff --cached --quiet; then
            echo "字典无变化，跳过提交"
            exit 0
          fi
          rows=$(wc -l < actor_dict.csv)
          git commit -m "chore(base-db): update actor_dict.csv (${rows} rows)"
          git pull --rebase --autostash origin main
          git push

      - name: Summary
        if: always()
        run: |
          echo "### 基础数据库" >> "$GITHUB_STEP_SUMMARY"
          if [ -f actor_dict.csv ]; then
            echo "- 文件大小：$(du -h actor_dict.csv | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
            echo "- 行数：$(wc -l < actor_dict.csv)" >> "$GITHUB_STEP_SUMMARY"
            echo "- 去重演员：$(tail -n +2 actor_dict.csv | cut -d, -f2 | sort -u | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          fi
