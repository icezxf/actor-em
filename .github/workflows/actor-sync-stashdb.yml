name: actor-sync-stashdb

# 每次运行显示的名字：在 Actions 列表里一眼看出这批跑了什么参数
run-name: "[欧美库] limit=${{ inputs.limit }}并发=${{ inputs.concurrency }} dry=${{ inputs.dry_run }}${{ inputs.refresh_list == true && ' 刷新清单' || '' }}"

# 独立工作流：StashDB 欧美演员库（与日系 actor-sync 完全隔离）
#
# 清单：从 StashDB 分页拉取女性演员 UUID（排除亚洲国家码）→ actors_stashdb.txt
# 抓取：走现有刮削链路（--stash-list UUID 模式），StashDB 直查 + TPDB 补生日/三围
# 产物：actors_eu.jsonl（真源）/ actors_eu.json / actors_eu.manifest.json
#       都不与日系的 actors.jsonl 共用，调试期不会污染主库。
#
# 手动触发，不设定时（调试阶段避免误跑）；与日系共用 actor-data 并发组，防止同时打 API。

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "本轮最多处理多少个（0=不限；调试建议 10~100，全铺分批）"
        default: "10"
      concurrency:
        description: "并发抓取数"
        default: "6"
      refresh_list:
        description: "重新从 StashDB 拉取全量 UUID 清单（差量追加，一般不用每次勾）"
        type: boolean
        default: false
      dry_run:
        description: "只打印不写文件"
        type: boolean
        default: true
      include_asia:
        description: "清单包含亚洲国家码（一般不用勾）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actor-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ① 编译刮削程序
        run: go build -o /tmp/actorsync ./cmd/actorsync

      # 清单：默认用仓库里已有的 actors_stashdb.txt；勾了 refresh_list 才重新拉。
      - name: ② 刷新 StashDB 清单（仅勾选时）
        if: ${{ github.event.inputs.refresh_list == 'true' }}
        env:
          STASHDB_API_KEY: ${{ secrets.STASHDB_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.include_asia }}" = "true" ]; then ARGS="--include-asia"; fi
          python3 scripts/export_stashdb_list.py -o actors_stashdb.txt --per-page 200 $ARGS
          echo "清单行数：$(wc -l < actors_stashdb.txt)"

      - name: ③ 检查清单文件
        run: |
          if [ ! -f actors_stashdb.txt ]; then
            echo "::error::缺少 actors_stashdb.txt，请先勾选 refresh_list 跑一次"
            exit 1
          fi
          echo "清单行数：$(wc -l < actors_stashdb.txt)"

      # 欧美库不依赖 MDCx / gfriends / 中文人物站：关闭它们，省时省请求。
      # 只留 StashDB（主力）+ TPDB（补生日/三围/图）+ JavStash（权威生日兜底）。
      - name: ④ 刮削欧美演员（写独立库 actors_eu）
        env:
          STASHDB_API_KEY: ${{ secrets.STASHDB_API_KEY }}
          TPDB_API_KEY: ${{ secrets.TPDB_API_KEY }}
          JAVSTASH_API_KEY: ${{ secrets.JAVSTASH_API_KEY }}

          DRAMAFACE: "0"
          YINRENLU: "0"
          CINEWHO: "0"
          IDOLDB: "0"
          CASTWIKI: "0"
          THEACTORBASE: "0"
          GFRIENDS: "0"
          ACTORS_REVIEW_MAX: "0"

          LIMIT_INPUT: ${{ github.event.inputs.limit }}
          CONC_INPUT: ${{ github.event.inputs.concurrency }}
          DRY_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=(
            --stash-list actors_stashdb.txt
            --data actors_eu.jsonl
            --manifest actors_eu.manifest.json
            --xlsx actors_eu.xlsx
            --no-xlsx
          )
          if [ -n "$LIMIT_INPUT" ]; then ARGS+=(--limit "$LIMIT_INPUT"); fi
          if [ "$DRY_INPUT" = "true" ]; then ARGS+=(--dry-run); fi
          echo "运行参数：${ARGS[*]}"
          ACTORS_CONCURRENCY="$CONC_INPUT" /tmp/actorsync "${ARGS[@]}"

      - name: ⑤ 提交独立库到仓库（仅非 dry-run）
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "actor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          KEEP="$RUNNER_TEMP/eu-out"
          rm -rf "$KEEP"; mkdir -p "$KEEP"
          for f in actors_eu.jsonl actors_eu.json actors_eu.manifest.json actors_stashdb.txt; do
            [ -e "$f" ] && cp -a "$f" "$KEEP"/ || true
          done
          rows=$(wc -l < actors_eu.jsonl 2>/dev/null || echo 0)
          MSG="chore(actors-eu): sync $(date -u +%F) (${rows} actors)"

          commit_on_latest() {
            git fetch --depth=1 origin main || return 1
            git reset --hard FETCH_HEAD || return 1
            for f in actors_eu.jsonl actors_eu.json actors_eu.manifest.json actors_stashdb.txt; do
              if [ -f "$KEEP/$f" ]; then cp -a "$KEEP/$f" . || return 1; fi
            done
            for f in actors_eu.jsonl actors_eu.json actors_eu.manifest.json actors_stashdb.txt; do
              if [ -e "$f" ]; then git add -- "$f" || return 1; fi
            done
            if git diff --cached --quiet; then return 2; fi
            git commit -m "$MSG" || return 1
            return 0
          }

          for attempt in 1 2 3; do
            if commit_on_latest; then rc=0; else rc=$?; fi
            if [ "$rc" = 2 ]; then echo "本轮无变化，跳过提交"; exit 0; fi
            if [ "$rc" != 0 ]; then echo "提交失败（退出码 $rc）"; exit "$rc"; fi
            if git push; then echo "已推送（第 $attempt 次尝试）"; exit 0; fi
            echo "push 被拒，重新对齐后重试"; sleep 5
          done
          echo "连续 3 次推送失败，放弃"; exit 1

      - name: ⑥ 数据质量体检（仅非 dry-run）
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          if [ ! -f actors_eu.jsonl ]; then
            echo "没有 actors_eu.jsonl，跳过体检"; exit 0
          fi
          python3 scripts/check_quality.py actors_eu.jsonl \
            --json quality-eu-report.json > quality-eu-report.md 2> quality-eu-report.err || true
          cat quality-eu-report.md >> "$GITHUB_STEP_SUMMARY" || true
          if [ -s quality-eu-report.err ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**体检发现硬性问题：**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat quality-eu-report.err >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: ⑦ 上传体检报告
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-eu
          path: |
            quality-eu-report.md
            quality-eu-report.json
          retention-days: 90
          if-no-files-found: ignore

      - name: ⑧ 运行摘要
        if: always()
        run: |
          echo "### 欧美演员库（StashDB）" >> "$GITHUB_STEP_SUMMARY"
          for f in actors_eu.jsonl actors_eu.json actors_eu.manifest.json actors_stashdb.txt; do
            [ -f "$f" ] && echo "- $f：$(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done
