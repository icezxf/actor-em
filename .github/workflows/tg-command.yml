name: actor-tg-command

# 由 Cloudflare Worker 通过 repository_dispatch 触发：
# 每条 Telegram update 跑一次，处理完提交状态文件。
#
# 这条链路必须和 actor-sync 用同一套数据源（MDCx / gfriends / theactorbase），
# 否则 Telegram 里发个名字刮出来的人是「残的」——没有出生地/罩杯/出道年/标签/头像。

on:
  repository_dispatch:
    types: [actor-command]

permissions:
  contents: write

# 与 actor-sync、base-db 共用同一个 group，避免同时写数据文件
concurrency:
  group: actor-data
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 字典由 base-db 工作流维护，这里不再现生成（旧脚本已删除）。
      # 只校验存在，缺了就明确报错，别让人以为是「字典太旧」。
      - name: Check dictionary
        run: |
          if [ ! -f actor_dict.csv ]; then
            echo "::error::缺少 actor_dict.csv，请先手动跑一次 base-db 工作流"
            exit 1
          fi

      # 33MB 的 sqlite 不入库，现下现导；失败不阻塞（退化成只有在线源）
      - name: Export MDCx profiles
        run: |
          # MDCx 提供出生地/罩杯/出道年/标签，是这些字段的唯一来源。
          # 导出失败就不要带病继续：抓出来的记录是残的，事后还得 refresh 重抓。
          python3 scripts/export_profiles.py -o /tmp/mdcx_profiles.csv

      - name: Build
        run: go build -o /tmp/actorsync ./cmd/actorsync

      - name: Handle Telegram update
        env:
          TPDB_API_KEY: ${{ secrets.TPDB_API_KEY }}
          JAVSTASH_API_KEY: ${{ secrets.JAVSTASH_API_KEY }}
          STASHDB_API_KEY: ${{ secrets.STASHDB_API_KEY }}
          WIKI_EMAIL: ${{ secrets.WIKI_EMAIL }}

          # 离线档案 + 头像库 + 简介兜底源，必须和 actor-sync 一致
          # dramaface / 映人录 / 影中人 / jav-idol-db 默认开启（=0 可关）
          MDCX_CSV: /tmp/mdcx_profiles.csv
          GFRIENDS: "1"
          THEACTORBASE: "1"

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # webhook 与 getUpdates 互斥，这里发图就会 409
          ACTORS_REVIEW_MAX: "0"
          ACTORS_VERBOSE: "1"

          # Worker 把整条 update 作为字符串放进 client_payload.update
          TG_UPDATE: ${{ github.event.client_payload.update }}
        run: |
          if [ -z "$TG_UPDATE" ]; then
            echo "没有收到 update，退出"
            exit 1
          fi
          /tmp/actorsync --tg-once "$TG_UPDATE"

      - name: Commit state
        run: |
          git config user.name  "actor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # actors.jsonl 是真源，必须提交；actors.json 是派生，一起带上免得下游读到旧版。
          # 交互模式不一定生成 manifest，逐个判断存在再收。
          # xlsx 不入库（走 actor-sync 的 artifact）。
          KEEP="$RUNNER_TEMP/tg-out"
          rm -rf "$KEEP"; mkdir -p "$KEEP"
          for f in actors.jsonl actors.json actors.manifest.json \
                   data/avatar_review.json data/avatar_choices.json; do
            [ -f "$f" ] && cp -a --parents "$f" "$KEEP"/ || true
          done
          MSG="chore(actors): tg $(date -u +%F-%H%M)"

          # 数据文件整份重算，跟远端没有合并价值：对齐最新 main 再盖回去，
          # 不用 git pull --rebase（会在 actors.jsonl 上冲突，整轮结果丢掉）。
          # GitHub 的 run 是 bash -e，函数要显式 return、调用点写在 if 里。
          commit_on_latest() {
            git fetch --depth=1 origin main || return 1
            git reset --hard FETCH_HEAD || return 1
            for f in actors.jsonl actors.json actors.manifest.json \
                     data/avatar_review.json data/avatar_choices.json; do
              if [ -f "$KEEP/$f" ]; then cp -a "$KEEP/$f" "$f" || return 1; fi
              if [ -f "$f" ]; then git add -- "$f" || return 1; fi
            done
            if git diff --cached --quiet; then return 2; fi
            git commit -m "$MSG" || return 1
            return 0
          }

          for attempt in 1 2 3; do
            if commit_on_latest; then rc=0; else rc=$?; fi
            if [ "$rc" = 2 ]; then echo "本次无变化，跳过提交"; exit 0; fi
            if [ "$rc" != 0 ]; then echo "提交失败（退出码 $rc）"; exit "$rc"; fi
            if git push; then echo "已推送（第 $attempt 次尝试）"; exit 0; fi
            echo "push 被拒：远端在提交期间又前进了，重新对齐后重试"
            sleep 5
          done
          echo "连续 3 次推送失败，放弃"; exit 1
