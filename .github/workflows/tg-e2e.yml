name: actor-tg-e2e

# 一次性端到端自检：模拟 Telegram 回调打到 Worker，验证
# Worker -> repository_dispatch -> Actions(--tg-once) 链路是否通。
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send synthetic update to Worker /telegram
        env:
          HOOK_SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
          WORKER: https://actor-em-tg.2435817633.workers.dev
        run: |
          BODY='{"update_id":900001,"message":{"message_id":1,"date":1700000000,"chat":{"id":999000111},"from":{"id":999000111,"first_name":"e2e"},"text":"/help"}}'
          echo "=== POST /telegram (synthetic update) ==="
          curl -sS -X POST "$WORKER/telegram" \
            -H "Content-Type: application/json" \
            -H "x-telegram-bot-api-secret-token: $HOOK_SECRET" \
            -d "$BODY"
          echo
