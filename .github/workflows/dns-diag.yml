name: DNS 诊断

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 系统 DNS 解析
        run: |
          for d in javastash.org www.javastash.org ouxiangdanku.com www.ouxiangdanku.com stashdb.org api.theporndb.net; do
            echo "=== $d ==="
            ip=$(getent ahostsv4 "$d" 2>/dev/null | head -1 | awk '{print $1}')
            echo "  系统解析: ${ip:-无记录}"
          done

      - name: DoH 权威解析 (Cloudflare + Google)
        run: |
          for d in javastash.org ouxiangdanku.com stashdb.org; do
            echo "=== $d ==="
            echo -n "  CF DoH: "
            curl -sS --max-time 15 -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$d&type=A" || echo "查询失败"
            echo
            echo -n "  GG DoH: "
            curl -sS --max-time 15 -H 'accept: application/dns-json' "https://dns.google/resolve?name=$d&type=A" || echo "查询失败"
            echo
          done

      - name: 直接探测 endpoint
        run: |
          for u in https://javastash.org/graphql https://www.ouxiangdanku.com/ https://stashdb.org/graphql; do
            echo "=== $u ==="
            curl -sS --max-time 15 -o /dev/null -w "  HTTP %{http_code} (IP %{remote_ip})\n" "$u" || echo "  连接失败"
          done
