name: DNS 候选域名探测

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: JavStash 候选拼写 DNS + HTTP
        run: |
          for d in javstash.org www.javstash.org api.javstash.com javastash.org www.javastash.org api.javastash.com; do
            ip=$(getent ahostsv4 "$d" 2>/dev/null | head -1 | awk '{print $1}')
            printf "%-24s 系统解析=%-16s " "$d" "${ip:-无}"
            code=$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' "https://$d/graphql" 2>/dev/null || echo "FAIL")
            echo "graphql HTTP=$code"
          done

      - name: 偶像素库 候选拼写 DNS + HTTP
        run: |
          for d in ouxiangdanku.com www.ouxiangdanku.com ouxiangtuku.com www.ouxiangtuku.com ouxiangtuku.cc ouxiangdanku.cc ouxiangdanku.net ouxiangdanku.cn; do
            ip=$(getent ahostsv4 "$d" 2>/dev/null | head -1 | awk '{print $1}')
            printf "%-26s 系统解析=%-16s " "$d" "${ip:-无}"
            code=$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' "https://$d/" 2>/dev/null || echo "FAIL")
            echo "首页 HTTP=$code"
          done

      - name: 权威 DoH 查 javstash.org
        run: |
          for d in javstash.org api.javstash.com; do
            echo "=== $d ==="
            curl -sS --max-time 12 -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$d&type=A" || echo "查询失败"
            echo
          done
