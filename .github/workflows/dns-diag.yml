name: JavStash 域名验证

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 真实 GraphQL 查询 javstash.org
        env:
          JAVSTASH_API_KEY: ${{ secrets.JAVSTASH_API_KEY }}
        run: |
          echo "=== 1. schema 字段检查（现有字段串 weight/measurements 是否还在）==="
          curl -sS --max-time 20 https://javstash.org/graphql \
            -H "Authorization: Bearer $JAVSTASH_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ __type(name: \"Performer\") { fields { name } } }"}' \
            | head -c 2500
          echo

          echo "=== 2. ApiKey 头 + 项目现有字段串搜 桃乃木かな ==="
          curl -sS --max-time 20 https://javstash.org/graphql \
            -H "ApiKey: $JAVSTASH_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"query":"query Search($term: String!) { searchPerformer(term: $term) { id name aliases birth_date country ethnicity height weight gender career_start_year measurements { cup_size waist hip } images { url } urls { url } } }","variables":{"term":"桃乃木かな"}}' \
            | head -c 2500
          echo

          echo "=== 3. Bearer 头 + 精简字段对照 ==="
          curl -sS --max-time 20 https://javstash.org/graphql \
            -H "Authorization: Bearer $JAVSTASH_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"query":"query Search($term: String!) { searchPerformer(term: $term) { id name images { url } } }","variables":{"term":"桃乃木かな"}}' \
            | head -c 1500
          echo
