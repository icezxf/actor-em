name: avatar-pick

# 处理静态站「换头像」提交：读取 [avatar] 开头的 issue，把选中的图片
# 写进 data/avatar_choices.json，**并立即应用到数据库**，最后重建页面。
#
# 为什么要有「立即应用」这一步：choices 原本只在「该演员被重新抓取」时才生效，
# 所以用户点了选图、issue 也处理了，页面上的头像却一直不变。
#
# issue 正文格式（页面自动生成）：
#   key: stashdb:xxxx-...
#   name: 某人
#   image: https://...

on:
  issues:
    types: [opened]
  # 静态站点「换头像」直接调 Worker → Worker 派发这个事件（免 issue）
  repository_dispatch:
    types: [avatar-pick]

permissions:
  contents: write
  issues: write
  actions: write      # 触发 pages 重建

# 独立并发组：不要和抓取任务抢 actor-data，否则选图会被长时间任务堵住
concurrency:
  group: avatar-pick
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[avatar]')) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'avatar-pick')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 必须落在 main 分支上：detached HEAD 状态下 git pull --rebase 会报
      # "You are not currently on a branch"，推送就失败了
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: ① 解析来源（issue 或 Worker 派发）
        id: parse
        env:
          EVENT: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          PAYLOAD_KEY: ${{ github.event.client_payload.key }}
          PAYLOAD_IMAGE: ${{ github.event.client_payload.image }}
        run: |
          python3 - <<'PY'
          import os, re
          if os.environ.get("EVENT") == "repository_dispatch":
              key = (os.environ.get("PAYLOAD_KEY") or "").strip()
              image = (os.environ.get("PAYLOAD_IMAGE") or "").strip()
              name = ""
          else:
              body = os.environ.get("ISSUE_BODY", "")
              def grab(label):
                  m = re.search(rf"^{label}\s*:\s*(\S+)\s*$", body, re.M)
                  return m.group(1).strip() if m else ""
              key, name, image = grab("key"), grab("name"), grab("image")
          ok = bool(key and image and image.startswith("http"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"ok={'true' if ok else 'false'}\n")
              f.write(f"key={key}\n")
              f.write(f"image={image}\n")
              f.write(f"name={name}\n")
          print(f"key={key} name={name} image={image[:80]} ok={ok}")
          PY

      - name: ② 写入 avatar_choices.json
        if: steps.parse.outputs.ok == 'true'
        env:
          KEY: ${{ steps.parse.outputs.key }}
          IMAGE: ${{ steps.parse.outputs.image }}
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json, os, datetime
          path = "data/avatar_choices.json"
          try:
              doc = json.load(open(path, encoding="utf-8"))
          except Exception:
              doc = {"version": 1, "choices": {}}
          doc.setdefault("version", 1)
          doc.setdefault("choices", {})[os.environ["KEY"]] = {
              "url": os.environ["IMAGE"],
              "at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "source": "pages",
          }
          with open(path, "w", encoding="utf-8") as f:
              json.dump(doc, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"已记录 {os.environ['KEY']} → {os.environ['IMAGE'][:80]}")
          PY

      - name: ③ 应用到两套库（立即生效，不重抓）
        if: steps.parse.outputs.ok == 'true'
        run: |
          go build -o /tmp/actorsync ./cmd/actorsync
          for db in actors.jsonl actors_eu.jsonl; do
            if [ -f "$db" ]; then
              echo "── $db ──"
              /tmp/actorsync --apply-choices --data "$db" || echo "::warning::$db 应用失败"
            fi
          done

      - name: ④ 提交（choices + 两套库）
        if: steps.parse.outputs.ok == 'true'
        run: |
          git config user.name  "actor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/avatar_choices.json actors.jsonl actors.json actors_eu.jsonl actors_eu.json; do
            [ -e "$f" ] && git add -- "$f" || true
          done
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "feat(avatar): pick from pages for ${{ steps.parse.outputs.key }}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main >/dev/null 2>&1 || true
            if git push; then echo "已推送"; exit 0; fi
            sleep 5
          done
          echo "::error::推送失败"; exit 1

      - name: ⑤ 重建静态站
        if: steps.parse.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" || echo "::warning::pages 触发失败"

      - name: ⑥ 关闭 issue 并回复（仅 issue 来源）
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
          OK: ${{ steps.parse.outputs.ok }}
          KEY: ${{ steps.parse.outputs.key }}
        run: |
          if [ "$OK" = "true" ]; then
            MSG="已应用：\`$KEY\` 的头像已写入数据库，页面稍后刷新即可看到。"
          else
            MSG="解析失败：正文里需要有 \`key:\` 和 \`image:\` 两行。"
          fi
          gh issue comment "$NUM" --repo "${{ github.repository }}" --body "$MSG" || true
          gh issue close "$NUM" --repo "${{ github.repository }}" || true
