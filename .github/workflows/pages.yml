name: pages

# 工作流 3：把 actors.jsonl 派生成可搜索的静态站，发到 GitHub Pages。
# 只读数据、不写回仓库：产物走 Pages artifact，仓库里不存生成物（site/ 已 gitignore）。
# 触发：模板/脚本改动、actor-sync 跑完（每天数据更新后重建）、手动。

on:
  push:
    branches: [main]
    paths:
      - "site_src/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
      - "actors.jsonl"          # 日系库更新后重建（之前漏了，只有 actor-sync 的 workflow_run 兜底）
      - "actors_eu.jsonl"       # 欧美库更新后重建页面
      - "data/popularity_*.json"  # 人气排名更新后重建
  workflow_run:
    workflows: [actor-sync, actor-sync-stashdb, update-popularity, build-avatar-index, merge-actors]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 从 actors.jsonl 生成站点
        run: python3 scripts/build_site.py actors.jsonl

      # 数据用 AES-256-GCM 加密：GitHub Pages 没有访问控制，
      # 只有拿到密码的人能解密 data/**/*.enc。
      - name: 加密站点数据
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::缺少 SITE_PASSWORD secret，无法加密数据"
            exit 1
          fi
          node scripts/encrypt_site.mjs
          echo "剩余明文 JSON：$(find site -name '*.json' | wc -l) 个（应为 0）"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
