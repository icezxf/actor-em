name: pages

# 工作流 3：把 actors.jsonl 派生成可搜索的静态站，发到 GitHub Pages。
# 只读数据、不写回仓库：产物走 Pages artifact，仓库里不存生成物（site/ 已 gitignore）。
# 触发：模板/脚本改动、actor-sync 跑完（每天数据更新后重建）、手动。

on:
  push:
    branches: [main]
    paths:
      - "site_src/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [actor-sync]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 从 actors.jsonl 生成站点
        run: python3 scripts/build_site.py actors.jsonl

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
